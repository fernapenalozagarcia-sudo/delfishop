<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Catálogo · OLMO</title>
    <meta name="description" content="Explora el catálogo de ropa OLMO para caballero, dama, niño, niña y bebé." />
    <meta name="theme-color" content="#1b1a17" />
    <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/catalogo.css" />
    <script src="../js/boot-check.js"></script>
    <script type="module" src="../js/pages/catalog.js"></script>
  </head>
  <body>
    <div id="app-header"></div>

    <main id="main" class="page" tabindex="-1">
      <div class="container">
        <nav class="breadcrumb" aria-label="Ruta de navegación">
          <ol id="breadcrumb">
            <li><a href="../index.html">Inicio</a></li>
            <li><span aria-current="page">Catálogo</span></li>
          </ol>
        </nav>

        <header class="catalog-header">
          <h1 class="page-title" id="catalog-title">Catálogo</h1>
          <p class="page-subtitle" id="catalog-description">Explora todas nuestras prendas.</p>
        </header>

        <div class="catalog-nav">
          <div class="chip-list" id="category-chips" role="group" aria-label="Categorías"></div>
          <div class="chip-list chip-list--sub" id="subcategory-chips" role="group" aria-label="Subcategorías"></div>
        </div>

        <div class="catalog-layout">
          <aside class="filters" id="filters-panel" aria-labelledby="filters-title">
            <div class="filters__header">
              <h2 class="filters__title" id="filters-title">Filtros</h2>
              <button type="button" class="icon-button filters__close" id="filters-close" aria-label="Cerrar filtros"></button>
            </div>
            <form class="filters__form" id="filters-form" novalidate></form>
            <div class="filters__footer">
              <button type="button" class="btn btn--outline btn--block" id="clear-filters">Limpiar filtros</button>
              <button type="button" class="btn btn--primary btn--block filters__apply" id="filters-apply">Ver resultados</button>
            </div>
          </aside>
          <div class="filters-backdrop" id="filters-backdrop" hidden></div>

          <section class="catalog-results" aria-labelledby="catalog-title">
            <div class="catalog-toolbar">
              <button type="button" class="btn btn--outline btn--sm filters-toggle" id="filters-toggle" aria-controls="filters-panel" aria-expanded="false">Filtros</button>
              <p class="catalog-toolbar__count" id="results-count" aria-live="polite">Cargando productos…</p>
              <div class="catalog-toolbar__sort">
                <label for="sort-select" class="catalog-toolbar__label">Ordenar por</label>
                <select id="sort-select" class="select select--sm"></select>
              </div>
            </div>
            <div class="chip-list active-filters" id="active-filters" aria-label="Filtros aplicados"></div>
            <div id="product-results" aria-busy="true"></div>
            <div class="load-more" id="load-more"></div>
          </section>
        </div>
      </div>
    </main>

    <div id="app-footer"></div>
  </body>
</html>
