<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Producto · OLMO</title>
    <meta name="description" content="Detalles del producto: tallas, colores, existencias y precio." />
    <meta name="theme-color" content="#1b1a17" />
    <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/catalogo.css" />
    <script src="../js/boot-check.js"></script>
    <script type="module" src="../js/pages/product.js"></script>
  </head>
  <body>
    <div id="app-header"></div>

    <main id="main" class="page" tabindex="-1">
      <div class="container">
        <nav class="breadcrumb" aria-label="Ruta de navegación">
          <ol id="breadcrumb">
            <li><a href="../index.html">Inicio</a></li>
            <li><a href="catalogo.html">Catálogo</a></li>
          </ol>
        </nav>
        <div id="product-root" aria-busy="true">
          <div class="product-detail" aria-hidden="true">
            <div class="skeleton product-skeleton__media"></div>
            <div class="product-skeleton__info">
              <div class="skeleton product-skeleton__line"></div>
              <div class="skeleton product-skeleton__line product-skeleton__line--short"></div>
              <div class="skeleton product-skeleton__block"></div>
            </div>
          </div>
        </div>
      </div>

      <section class="section section--tint" id="related-section" aria-labelledby="related-title" hidden>
        <div class="container">
          <div class="section-header">
            <h2 class="section-title" id="related-title">También te puede gustar</h2>
            <a class="btn btn--outline btn--sm" id="related-link" href="catalogo.html">Ver más de la categoría</a>
          </div>
          <div id="related-products"></div>
        </div>
      </section>
    </main>

    <div id="app-footer"></div>
  </body>
</html>
