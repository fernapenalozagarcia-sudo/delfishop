<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard · Administración OLMO</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#1b1a17" />
    <link rel="icon" href="../../assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="../../css/styles.css" />
    <link rel="stylesheet" href="../../css/components.css" />
    <link rel="stylesheet" href="../../css/admin.css" />
    <script src="../../js/boot-check.js"></script>
    <script type="module" src="../../js/pages/admin/dashboard.js"></script>
  </head>
  <body class="admin-body">
    <a class="skip-link" href="#main">Saltar al contenido principal</a>
    <div class="admin-shell">
      <aside class="admin-sidebar" id="admin-sidebar"></aside>
      <div class="admin-main">
        <header class="admin-topbar" id="admin-topbar"></header>
        <main id="main" class="admin-content" tabindex="-1">
          <header class="page-header">
            <div>
              <h1 class="page-title">Dashboard</h1>
              <p class="page-subtitle">Resumen del inventario, los pedidos y las ventas completadas.</p>
            </div>
            <p class="admin-updated" id="dashboard-updated" aria-live="polite"></p>
          </header>
          <section aria-label="Indicadores" class="kpi-grid" id="kpi-grid" aria-busy="true"></section>
          <div class="dashboard-grid">
            <section class="card" aria-labelledby="chart-title">
              <div class="card__header">
                <h2 class="card__title" id="chart-title">Ventas de los últimos 14 días</h2>
                <a class="link-button" href="ventas.html">Ver ventas</a>
              </div>
              <div id="sales-chart"></div>
            </section>
            <section class="card" aria-labelledby="status-title">
              <div class="card__header">
                <h2 class="card__title" id="status-title">Pedidos por estado</h2>
                <a class="link-button" href="pedidos.html">Ver pedidos</a>
              </div>
              <div id="status-breakdown"></div>
            </section>
            <section class="card dashboard-grid__wide" aria-labelledby="recent-title">
              <div class="card__header">
                <h2 class="card__title" id="recent-title">Pedidos recientes</h2>
                <a class="link-button" href="pedidos.html">Gestionar pedidos</a>
              </div>
              <div id="recent-orders"></div>
            </section>
            <section class="card" aria-labelledby="stock-title">
              <div class="card__header">
                <h2 class="card__title" id="stock-title">Requieren reposición</h2>
                <a class="link-button" href="inventario.html?estado=reponer">Ver inventario</a>
              </div>
              <div id="stock-alerts"></div>
            </section>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
